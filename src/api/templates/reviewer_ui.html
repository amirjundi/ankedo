<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnkEdo - Human Review UI</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 2rem; background: #f4f5f7; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #1a202c; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
        .queue-item { border: 1px solid #cbd5e0; border-radius: 6px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .platform-badge { background: #4a5568; color: white; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: bold; }
        .score { font-size: 1.25rem; font-weight: bold; color: #e53e3e; }
        .content { background: #edf2f7; padding: 1rem; border-radius: 4px; font-size: 1.125rem; line-height: 1.6; margin-bottom: 1rem; }
        .trace { background: #2d3748; color: #e2e8f0; padding: 1rem; border-radius: 4px; font-family: monospace; white-space: pre-wrap; font-size: 0.875rem; margin-bottom: 1rem; overflow-x: auto; }
        .actions { display: flex; gap: 1rem; }
        button { padding: 0.75rem 1.5rem; border: none; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-confirm { background: #e53e3e; color: white; }
        .btn-reject { background: #48bb78; color: white; }
        .btn-skip { background: #a0aec0; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Review Queue</h1>
        <div id="queue-container">
            <p>Loading queue...</p>
        </div>
    </div>
    <script>
        // Stub UI logic
        document.getElementById('queue-container').innerHTML = `
            <div class="queue-item">
                <div class="item-header">
                    <span class="platform-badge">Facebook</span>
                    <span class="score">Score: 0.92 (High Confidence)</span>
                </div>
                <div class="content" dir="rtl">
                    هذا نص تجريبي لكلام يحض على الكراهية. (This is sample hate speech text.)
                </div>
                <h4>Committee Trace</h4>
                <div class="trace">Triage: Passed (Score: N/A)
Specialist: Flagged (Score: 0.92) - Rationale: Uses trope #43
Critic: Agreed</div>
                <div class="actions">
                    <button class="btn-confirm">Confirm Flag</button>
                    <button class="btn-reject">Reject (False Positive)</button>
                    <button class="btn-skip">Skip</button>
                </div>
            </div>
        `;
    </script>
</body>
</html>
