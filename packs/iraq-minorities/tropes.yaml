entries:
- trope_id: yazidi-devil-worship
  target_group: yazidi
  surface_forms:
  - text: اعوذ بالله من الشيطان الرجيم
    register: religious_formula
  - text: عبدة الشيطان
    register: direct_epithet
  activation:
    requires_target_group: true
    post_topic_any:
    - yazidi
    - sinjar
    - lalish
    negation_cancels: true
  implicature: 'Invokes the devil-worship libel against Yazidis — a defamation historically
    used to justify violence, including the 2014 Sinjar genocide.

    '
  severity: 4
  positive_examples:
  - comment_text: اعوذ بالله من الشيطان الرجيم
    parent_post_text: مراسم دينية إيزيدية في معبد لالش
    why: 'The pious formula is directed at Yazidi religious practice, invoking the
      devil-worship trope. Hostile despite containing no slur.

      '
  negative_examples:
  - comment_text: اعوذ بالله من الشيطان الرجيم
    parent_post_text: شاهدوا هذا الثعبان الضخم في الحديقة
    why: 'Identical text, ordinary reaction to an unrelated post. No target group
      in context, so the trope must NOT fire. This pair is the acceptance test.

      '
  - comment_text: اعوذ بالله من الشيطان الرجيم
    parent_post_text: خطبة الجمعة اليوم عن الصبر
    why: Routine devout speech in a religious context unrelated to any minority.
  counter_speech_examples:
  - comment_text: الإيزيديون ليسوا عبدة الشيطان، هذا افتراء
    parent_post_text: مراسم دينية إيزيدية في معبد لالش
    why: 'Contains the surface form while explicitly refuting it. negation_cancels
      must suppress this — flagging defenders is the highest-cost false positive.

      '
  confirmed_in_cases: []
  pack_version: 0.1.0
  source: duhok-focus-group row 3 (SRS 4.4.0 worked example)
