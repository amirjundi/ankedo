[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ankedo"
version = "0.1.0"
description = "AI-powered hate speech monitoring agent for Arabic and Kurdish social media"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Browser automation & anti-detect
    "playwright>=1.44.0",
    "camoufox[geoip]>=0.4.0",

    # Database & ORM
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",

    # Multi-agent orchestration
    "langgraph>=0.2.0",

    # LLM providers
    "openai>=1.40.0",
    "anthropic>=0.34.0",

    # API server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # Validation & settings
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",

    # HTTP client (for WhatsApp API, MCP servers)
    "httpx>=0.27.0",

    # Cryptography (encrypt credentials at rest)
    "cryptography>=42.0.0",

    # Chat channels
    "aiogram>=3.10.0",

    # MCP client
    "mcp[cli]>=1.0.0",

    # Utilities
    "structlog>=24.4.0",
    "rich>=13.7.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",   # for FastAPI TestClient
]

[project.scripts]
ankedo = "src.cli.__main__:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"src/tests/**" = ["S101"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
